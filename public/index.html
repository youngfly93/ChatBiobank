<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BioMentor 3M</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&family=Source+Sans+3:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- 移动端顶部栏（独立于 sidebar，始终可见） -->
        <div class="mobile-header">
            <span class="mobile-brand">BioMentor 3M</span>
            <button class="mobile-menu-btn" id="mobileMenuBtn">
                <i class="fas fa-bars"></i>
            </button>
        </div>

        <!-- 侧边栏 -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-body">

                <!-- 顶部区域 -->
                <div class="sidebar-top">
                    <!-- Logo区域 -->
                    <div class="sidebar-logo" id="sidebarLogo">
                        <div class="logo-icon">
                            <div class="logo-shape"></div>
                        </div>
                        <span class="logo-text">yanglab</span>
                    </div>

                    <!-- 导航链接 -->
                    <div class="sidebar-nav">
                        <a href="#" class="sidebar-link active" id="newChatBtn">
                            <div class="link-icon">
                                <i class="fas fa-plus"></i>
                            </div>
                            <span class="link-text">New Chat</span>
                        </a>

                        <a href="#" class="sidebar-link">
                            <div class="link-icon">
                                <i class="fas fa-clock-rotate-left"></i>
                            </div>
                            <span class="link-text">History</span>
                        </a>
                    </div>

                    <!-- 聊天历史区域 -->
                    <div class="chat-history-section">
                        <div class="section-divider"></div>
                        <div class="chat-history" id="chatHistory">
                            <!-- 历史记录将动态添加到这里 -->
                        </div>
                    </div>
                </div>

                <!-- 底部区域 -->
                <div class="sidebar-bottom">
                    <a href="3m/" class="framework-link" target="_blank">
                        <div class="link-icon">
                            <i class="fas fa-arrow-up-right-from-square"></i>
                        </div>
                        <span class="link-text">Explore 3M Framework</span>
                    </a>
                    <div class="section-divider"></div>
                    <div class="sidebar-link user-profile" id="userProfile">
                        <div class="link-icon">
                            <img src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=32&h=32&fit=crop&crop=face&auto=format"
                                 alt="User" class="user-avatar">
                        </div>
                        <span class="link-text">Researcher</span>
                    </div>
                </div>
            </div>

            <!-- 移动端侧边栏遮罩 -->
            <div class="mobile-overlay" id="mobileOverlay"></div>
        </aside>

        <!-- 主聊天区域 -->
        <main class="main-content">
            <!-- 欢迎区域 -->
            <div class="welcome-section" id="welcomeSection">
                <div class="welcome-title">
                    <img src="icon.png" alt="BioMentor 3M" class="title-icon">
                    <h1 class="title-text">
                        <span class="shiny-text">BioMentor 3M</span>
                    </h1>
                    <p class="title-tagline">Grounded in the 3M framework for multi-omics biobank protocols, ethics, and workflows.</p>
                </div>
            </div>

            <!-- 聊天消息区域 -->
            <div class="chat-container" id="chatContainer">
                <div class="messages" id="messages">
                    <!-- 消息将动态添加到这里 -->
                </div>
            </div>

            <!-- 输入区域 -->
            <div class="input-section">
                <div class="input-container">
                    <form id="chatForm" class="chat-form">
                        <div class="input-wrapper">
                            <textarea
                                id="messageInput"
                                class="message-input"
                                placeholder="Ask about biobank protocols, sample requirements, or omics specifications..."
                                rows="1"
                            ></textarea>
                            <div class="input-actions">
                                <button type="button" class="attach-btn" id="attachBtn">
                                    <i class="fas fa-paperclip"></i>
                                </button>
                                <input type="file" id="fileInput" style="display: none;" accept="image/*">
                                <button type="submit" class="send-btn" id="sendBtn">
                                    <i class="fas fa-arrow-up"></i>
                                </button>
                            </div>
                        </div>
                    </form>

                    <!-- 功能按钮：与 3M Framework 栏目名对齐 -->
                    <div class="feature-buttons">
                        <button class="feature-btn">
                            <i class="fas fa-dna"></i>
                            <span>Omics Requirements</span>
                        </button>
                        <button class="feature-btn">
                            <i class="fas fa-vials"></i>
                            <span>Sample Management</span>
                        </button>
                        <button class="feature-btn">
                            <i class="fas fa-file-contract"></i>
                            <span>Ethics & Security</span>
                        </button>
                        <button class="feature-btn">
                            <i class="fas fa-project-diagram"></i>
                            <span>Biobank Workflow</span>
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
